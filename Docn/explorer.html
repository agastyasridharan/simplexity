<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================
//  PRNG
// =====================================================
function mulberry32(seed) {
  let a = seed | 0;
  return function() {
    a = (a + 0x6D2B79F5) | 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function sampleDiscrete(p, rng) {
  const r = rng(); let c = 0;
  for (let i = 0; i < p.length; i++) { c += p[i]; if (r < c) return i; }
  return p.length - 1;
}

// =====================================================
//  Process kernels
//  Each kernel is { Tlist, n_states, n_outputs }
//   - Tlist[y]   = matrix [n_states][n_states] for HMM source (no input)
//   - For transducers: TlistPerInput[x][y] = matrix per (input, output)
// =====================================================

const ARCHS = {
  iid:      { name: 'IID',      n_states: 1, n_outputs: 2 },
  sns:      { name: 'SNS',      n_states: 2, n_outputs: 2 },
  fractal2: { name: 'Fractal2', n_states: 2, n_outputs: 2 },
  mess3:    { name: 'Mess3',    n_states: 3, n_outputs: 3 },
};

// HMM source kernels (no input)
function kernel_iid_source(p) {
  return [ [[1 - p]], [[p]] ];                                // T0=[[1-p]], T1=[[p]]
}
function kernel_sns_source(p) {
  // Simple Nonunifilar Source. States A=0, B=1.
  //   A:  emit 0, self-loop with prob p;  emit 0, → B with prob 1-p
  //   B:  emit 0, self-loop with prob p;  emit 1, → A with prob 1-p
  const T0 = [[p, 1 - p], [0, p]];
  const T1 = [[0, 0],     [1 - p, 0]];
  return [T0, T1];
}
function kernel_fractal2_source(b, p, q) {
  const T0 = [[b, 0], [(1 - b) * q, (1 - b) * (1 - q)]];
  const T1 = [[(1 - b) * (1 - p), (1 - b) * p], [0, b]];
  return [T0, T1];
}
function kernel_mess3_source(x, alpha) {
  const b = (1 - alpha) / 2, y = 1 - 2 * x;
  const ay = alpha * y, bx = b * x, by = b * y, ax = alpha * x;
  return [
    [[ay, bx, bx], [ax, by, bx], [ax, bx, by]],
    [[by, ax, bx], [bx, ay, bx], [bx, ax, by]],
    [[by, bx, ax], [bx, by, ax], [bx, bx, ay]],
  ];
}

// Transducer kernels — return list-of-list-of-matrices, indexed [input][output]
function transducer_iid(params, n_in) {
  // For each input x, the channel emits y=1 with prob params['p_x'+x]
  const out = [];
  for (let x = 0; x < n_in; x++) {
    const p1 = params['p_'+x];
    out.push([ [[1 - p1]], [[p1]] ]);
  }
  return out;
}
function transducer_sns(params, n_in) {
  const out = [];
  for (let x = 0; x < n_in; x++) {
    out.push(kernel_sns_source(params['p_'+x]));
  }
  return out;
}
function transducer_fractal2(params, n_in) {
  const out = [];
  for (let x = 0; x < n_in; x++) {
    out.push(kernel_fractal2_source(params['b_'+x], params['p_'+x], params['q_'+x]));
  }
  return out;
}
function transducer_mess3(params, n_in) {
  const out = [];
  for (let x = 0; x < n_in; x++) {
    out.push(kernel_mess3_source(params['x_'+x], params['alpha_'+x]));
  }
  return out;
}

// =====================================================
//  Linear algebra helpers
// =====================================================
function matSum(mats) {
  const n = mats[0].length, m = mats[0][0].length;
  const out = Array.from({length: n}, () => new Array(m).fill(0));
  for (const M of mats) for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) out[i][j] += M[i][j];
  return out;
}
function rowVecMat(eta, M) {
  const n = M.length, m = M[0].length;
  const out = new Array(m).fill(0);
  for (let j = 0; j < m; j++) for (let i = 0; i < n; i++) out[j] += eta[i] * M[i][j];
  return out;
}
function rowSum(M) {
  return M.map(row => row.reduce((a, b) => a + b, 0));
}
function stationary(Tfull) {
  const n = Tfull.length;
  // Power iteration on row-stochastic T (left eigenvector)
  let v = new Array(n).fill(1 / n);
  for (let it = 0; it < 200; it++) {
    const w = rowVecMat(v, Tfull);
    const s = w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < n; i++) w[i] /= s;
    let diff = 0;
    for (let i = 0; i < n; i++) diff += Math.abs(w[i] - v[i]);
    v = w;
    if (diff < 1e-10) break;
  }
  return v;
}
function tensorKron(A, B) {
  const aR = A.length, aC = A[0].length, bR = B.length, bC = B[0].length;
  const out = Array.from({length: aR * bR}, () => new Array(aC * bC).fill(0));
  for (let i = 0; i < aR; i++) for (let j = 0; j < aC; j++)
    for (let k = 0; k < bR; k++) for (let l = 0; l < bC; l++)
      out[i * bR + k][j * bC + l] = A[i][j] * B[k][l];
  return out;
}

// =====================================================
//  Sampling — three modes
// =====================================================
function sampleHMM(Tlist, nSteps, seed) {
  // Standard HMM: list of substochastic matrices indexed by output symbol
  const n = Tlist[0].length, n_y = Tlist.length;
  const Tfull = matSum(Tlist);
  let eta = stationary(Tfull);
  const rng = mulberry32(seed);
  const beliefs = new Float32Array(nSteps * n);
  const Pnext = new Float32Array(nSteps * n_y);
  for (let t = 0; t < nSteps; t++) {
    // emission distribution given current eta
    const em = new Array(n_y).fill(0);
    for (let y = 0; y < n_y; y++) {
      const v = rowSum(Tlist[y]);
      let s = 0;
      for (let i = 0; i < n; i++) s += eta[i] * v[i];
      em[y] = s;
    }
    const totE = em.reduce((a, b) => a + b, 0);
    for (let y = 0; y < n_y; y++) em[y] /= totE;
    const yt = sampleDiscrete(em, rng);
    // belief update
    const num = rowVecMat(eta, Tlist[yt]);
    const tot = num.reduce((a, b) => a + b, 0);
    for (let i = 0; i < n; i++) num[i] /= tot;
    eta = num;
    for (let i = 0; i < n; i++) beliefs[t * n + i] = eta[i];
    // predicted emission at new eta — for colour
    let totN = 0;
    for (let y = 0; y < n_y; y++) {
      const v = rowSum(Tlist[y]);
      let s = 0;
      for (let i = 0; i < n; i++) s += eta[i] * v[i];
      Pnext[t * n_y + y] = s;
      totN += s;
    }
    for (let y = 0; y < n_y; y++) Pnext[t * n_y + y] /= totN;
  }
  return { beliefs, Pnext, n_states: n, n_outputs: n_y };
}

function sampleDrivenTransducer(Tinput, Tperinput, nSteps, seed) {
  // Tinput: HMM source kernel list-of-matrices on R (input HMM emits y, transducer takes y as input)
  // Tperinput[y_input][x_output] = matrix on S
  const n_in = Tinput[0].length;
  const n_y = Tinput.length;          // input emission alphabet → transducer input
  const n_S = Tperinput[0][0].length;
  const n_x = Tperinput[0].length;    // transducer output alphabet
  const n_joint = n_in * n_S;
  // Build joint kernels indexed by (y_in, x_out) — Kronecker T_input^(y) ⊗ T_per_input[y][x]
  const jointKernels = {};
  for (let y = 0; y < n_y; y++) for (let x = 0; x < n_x; x++)
    jointKernels[y + ',' + x] = tensorKron(Tinput[y], Tperinput[y][x]);
  // Cascade kernels: W^(x) = Σ_y T^(y) ⊗ U^(x|y) — joint kernel for x-only observer.
  const cascadeX = [];
  for (let x = 0; x < n_x; x++) {
    const M = Array.from({length: n_joint}, () => new Array(n_joint).fill(0));
    for (let y = 0; y < n_y; y++) {
      const J = jointKernels[y + ',' + x];
      for (let i = 0; i < n_joint; i++) for (let j = 0; j < n_joint; j++) M[i][j] += J[i][j];
    }
    cascadeX.push(M);
  }
  const cascadeXrowSums = cascadeX.map(M => rowSum(M));
  // stationary
  const Tavg = Array.from({length: n_joint}, () => new Array(n_joint).fill(0));
  for (const k in jointKernels) for (let i = 0; i < n_joint; i++) for (let j = 0; j < n_joint; j++)
    Tavg[i][j] += jointKernels[k][i][j];
  let eta = stationary(Tavg);
  let etaCasc = eta.slice();  // cascade belief (only-x observer) — same initial as full
  const rng = mulberry32(seed);
  const inputBel = new Float32Array(nSteps * n_in);
  const trBel    = new Float32Array(nSteps * n_S);
  const jointBel = new Float32Array(nSteps * n_joint);
  const cascBel  = new Float32Array(nSteps * n_joint);
  const PmargIn  = new Float32Array(nSteps * n_y);
  const PmargOut = new Float32Array(nSteps * n_x);
  const PcascX   = new Float32Array(nSteps * n_x);
  for (let t = 0; t < nSteps; t++) {
    // joint emission dist
    const em = [];
    for (let y = 0; y < n_y; y++) for (let x = 0; x < n_x; x++) {
      const M = jointKernels[y + ',' + x];
      const rs = rowSum(M);
      let s = 0;
      for (let i = 0; i < n_joint; i++) s += eta[i] * rs[i];
      em.push(s);
    }
    const totE = em.reduce((a, b) => a + b, 0);
    for (let i = 0; i < em.length; i++) em[i] /= totE;
    const k = sampleDiscrete(em, rng);
    const yObs = Math.floor(k / n_x), xObs = k % n_x;
    const num = rowVecMat(eta, jointKernels[yObs + ',' + xObs]);
    const tot = num.reduce((a, b) => a + b, 0);
    for (let i = 0; i < n_joint; i++) num[i] /= tot;
    eta = num;
    for (let i = 0; i < n_joint; i++) jointBel[t * n_joint + i] = eta[i];
    // Cascade belief: observer sees only x_t, applies W^(x) = Σ_y T^(y) ⊗ U^(x|y).
    const cNum = rowVecMat(etaCasc, cascadeX[xObs]);
    const cTot = cNum.reduce((a, b) => a + b, 0);
    for (let i = 0; i < n_joint; i++) cNum[i] /= cTot;
    etaCasc = cNum;
    for (let i = 0; i < n_joint; i++) cascBel[t * n_joint + i] = etaCasc[i];
    // marginals
    for (let i = 0; i < n_in; i++) inputBel[t * n_in + i] = 0;
    for (let i = 0; i < n_S; i++)  trBel[t * n_S + i]    = 0;
    for (let i = 0; i < n_in; i++) for (let j = 0; j < n_S; j++) {
      const v = eta[i * n_S + j];
      inputBel[t * n_in + i] += v;
      trBel[t * n_S + j]    += v;
    }
    // predicted next-emission marginals at new belief
    let totIn = 0, totOut = 0;
    const newY = new Array(n_y).fill(0), newX = new Array(n_x).fill(0);
    for (let y = 0; y < n_y; y++) for (let x = 0; x < n_x; x++) {
      const M = jointKernels[y + ',' + x];
      const rs = rowSum(M);
      let s = 0;
      for (let i = 0; i < n_joint; i++) s += eta[i] * rs[i];
      newY[y] += s; newX[x] += s; totIn += s; totOut += s;
    }
    // totIn==totOut===total joint, but each marginal is normalized separately
    const tt = newY.reduce((a, b) => a + b, 0);
    for (let y = 0; y < n_y; y++) PmargIn[t * n_y + y]  = newY[y] / tt;
    for (let x = 0; x < n_x; x++) PmargOut[t * n_x + x] = newX[x] / tt;
    // predicted next-x from new cascade belief
    let cTotN = 0;
    const cNewX = new Array(n_x).fill(0);
    for (let x = 0; x < n_x; x++) {
      const rs = cascadeXrowSums[x];
      let s = 0;
      for (let i = 0; i < n_joint; i++) s += etaCasc[i] * rs[i];
      cNewX[x] = s; cTotN += s;
    }
    for (let x = 0; x < n_x; x++) PcascX[t * n_x + x] = cNewX[x] / cTotN;
  }
  return { inputBel, trBel, jointBel, cascBel, PmargIn, PmargOut, PcascX,
           n_in, n_S, n_y, n_x, n_joint };
}

function sampleFeedback(Tperx, Uupery, nSteps, seed) {
  // Tperx[x_input][y_output] = matrix on R
  // Uupery[y_input][x_output] = matrix on S
  const n_R = Tperx[0][0].length;
  const n_x = Tperx.length;          // T's input alphabet = U's output alphabet
  const n_y = Tperx[0].length;       // T's output alphabet = U's input alphabet
  const n_S = Uupery[0][0].length;
  // Modified operator on (S, X) joint: M^(x_obs, y_obs)[(s, x_state), (s', x')]
  //   = δ(x_state, x_obs) * U^(x'|y_obs)_{s, s'} * Σ_{r'} T^(y_obs|x_obs)_{r, r'}
  // But T-belief evolves separately; for U-modified-belief we only need U dynamics on (S, X).
  // Per Corollary 1 the two beliefs evolve independently; we track them separately.
  const n_joint = n_S * n_x;

  // Initial T-belief: stationary of Σ_y T^(y|x_avg) — for generic kernels we use uniform-x averaging
  // For simplicity: stationary of Σ_x Σ_y T^(y|x) / n_x
  let TfullR = Array.from({length: n_R}, () => new Array(n_R).fill(0));
  for (let x = 0; x < n_x; x++) for (let y = 0; y < n_y; y++)
    for (let i = 0; i < n_R; i++) for (let j = 0; j < n_R; j++)
      TfullR[i][j] += Tperx[x][y][i][j] / n_x;
  let rhoR = stationary(TfullR);

  // Initial U-modified-belief on flat (s, x) space; uniform.
  let rhoSX = new Array(n_joint).fill(1 / n_joint);

  const rng = mulberry32(seed);
  const Rbel  = new Float32Array(nSteps * n_R);
  const SXbel = new Float32Array(nSteps * n_joint);
  const Pnext_x = new Float32Array(nSteps * n_x);
  const Pnext_y = new Float32Array(nSteps * n_y);

  // Coarse-grain cascade beliefs over (R, S, X) — joint dim n_R * n_joint.
  //  cascY: belief given only y observed (coarse-grain x); kernel W^(y)[(r,s,xs),(rp,sp,xp)] = T^(y|xs)[r,rp]·U^(y)(xp|s,sp)
  //  cascX: belief given only x observed (coarse-grain y); kernel W^(x)[(r,s,xs),(rp,sp,xp)] = δ(xs,x)·Σ_y T^(y|x)[r,rp]·U^(y)(xp|s,sp)
  const n_full = n_R * n_joint;
  let rhoFullY = new Array(n_full).fill(1 / n_full);
  let rhoFullX = new Array(n_full).fill(1 / n_full);
  const cascBel_y = new Float32Array(nSteps * n_full);
  const cascBel_x = new Float32Array(nSteps * n_full);
  const Pcasc_y_next = new Float32Array(nSteps * n_y);
  const Pcasc_x_next = new Float32Array(nSteps * n_x);

  for (let t = 0; t < nSteps; t++) {
    // Sample x_t from X-marginal of rhoSX
    const xMarg = new Array(n_x).fill(0);
    for (let s = 0; s < n_S; s++) for (let x = 0; x < n_x; x++)
      xMarg[x] += rhoSX[s * n_x + x];
    let sxm = xMarg.reduce((a, b) => a + b, 0);
    if (sxm <= 0) { for (let x = 0; x < n_x; x++) xMarg[x] = 1 / n_x; sxm = 1; }
    for (let x = 0; x < n_x; x++) xMarg[x] /= sxm;
    const xObs = sampleDiscrete(xMarg, rng);

    // P(y | x_t, rho_R) = rho_R · (Σ_{r'} T^(y|x_t))
    const ydist = new Array(n_y).fill(0);
    for (let y = 0; y < n_y; y++) {
      const rs = rowSum(Tperx[xObs][y]);
      let s = 0;
      for (let i = 0; i < n_R; i++) s += rhoR[i] * rs[i];
      ydist[y] = s;
    }
    let syt = ydist.reduce((a, b) => a + b, 0);
    if (syt <= 0) { for (let y = 0; y < n_y; y++) ydist[y] = 1 / n_y; syt = 1; }
    for (let y = 0; y < n_y; y++) ydist[y] /= syt;
    const yObs = sampleDiscrete(ydist, rng);

    // Update rho_R: rho_R ← rho_R · T^(y_obs|x_obs)
    const newR = rowVecMat(rhoR, Tperx[xObs][yObs]);
    let totR = newR.reduce((a, b) => a + b, 0);
    if (totR > 0) for (let i = 0; i < n_R; i++) newR[i] /= totR;
    rhoR = newR;
    for (let i = 0; i < n_R; i++) Rbel[t * n_R + i] = rhoR[i];

    // Update rho_SX: only states with x_state == x_obs propagate
    const newSX = new Array(n_joint).fill(0);
    for (let s = 0; s < n_S; s++) {
      // Old mass at (s, x_obs)
      const old = rhoSX[s * n_x + xObs];
      if (old === 0) continue;
      for (let sp = 0; sp < n_S; sp++) for (let xp = 0; xp < n_x; xp++) {
        newSX[sp * n_x + xp] += old * Uupery[yObs][xp][s][sp];
      }
    }
    let totSX = newSX.reduce((a, b) => a + b, 0);
    if (totSX > 0) for (let i = 0; i < n_joint; i++) newSX[i] /= totSX;
    rhoSX = newSX;
    for (let i = 0; i < n_joint; i++) SXbel[t * n_joint + i] = rhoSX[i];

    // Predicted next x marginal at new SX; predicted next y at new R via Σ_x P(x) T(y|x)
    const xm = new Array(n_x).fill(0);
    for (let s = 0; s < n_S; s++) for (let x = 0; x < n_x; x++) xm[x] += rhoSX[s * n_x + x];
    let sxm2 = xm.reduce((a, b) => a + b, 0);
    if (sxm2 > 0) for (let x = 0; x < n_x; x++) xm[x] /= sxm2;
    for (let x = 0; x < n_x; x++) Pnext_x[t * n_x + x] = xm[x];

    const ym = new Array(n_y).fill(0);
    for (let x = 0; x < n_x; x++) {
      for (let y = 0; y < n_y; y++) {
        const rs = rowSum(Tperx[x][y]);
        let s = 0;
        for (let i = 0; i < n_R; i++) s += rhoR[i] * rs[i];
        ym[y] += xm[x] * s;
      }
    }
    let sym = ym.reduce((a, b) => a + b, 0);
    if (sym > 0) for (let y = 0; y < n_y; y++) ym[y] /= sym;
    for (let y = 0; y < n_y; y++) Pnext_y[t * n_y + y] = ym[y];

    // ----- Coarse-grain cascade updates over (R, S, X) -----
    // cascY (only y observed): W^(y_t)[(r,s,xs),(rp,sp,xp)] = T^(y_t|xs)[r,rp] · U^(y_t)(xp|s,sp)
    {
      const newY = new Array(n_full).fill(0);
      for (let r = 0; r < n_R; r++) for (let s = 0; s < n_S; s++) for (let xs = 0; xs < n_x; xs++) {
        const old = rhoFullY[r * n_joint + s * n_x + xs];
        if (old === 0) continue;
        for (let rp = 0; rp < n_R; rp++) for (let sp = 0; sp < n_S; sp++) for (let xp = 0; xp < n_x; xp++) {
          newY[rp * n_joint + sp * n_x + xp] += old * Tperx[xs][yObs][r][rp] * Uupery[yObs][xp][s][sp];
        }
      }
      let totY = newY.reduce((a, b) => a + b, 0);
      if (totY > 0) for (let i = 0; i < n_full; i++) newY[i] /= totY;
      rhoFullY = newY;
      for (let i = 0; i < n_full; i++) cascBel_y[t * n_full + i] = rhoFullY[i];
      // Predicted next y: Σ_{r,s,xs} rhoFullY · Σ_{y_next, rp, sp, xp} T^(y_next|xs)[r,rp]·U^(y_next)(xp|s,sp)
      // = Σ_{r,s,xs} rhoFullY(r,s,xs) · Σ_{y_next, rp} T^(y_next|xs)[r,rp]
      // (the U-side row-sums to 1 over (sp, xp))
      const yN = new Array(n_y).fill(0);
      for (let r = 0; r < n_R; r++) for (let s = 0; s < n_S; s++) for (let xs = 0; xs < n_x; xs++) {
        const mass = rhoFullY[r * n_joint + s * n_x + xs];
        if (mass === 0) continue;
        for (let yy = 0; yy < n_y; yy++) {
          // U row sums to 1 over (sp, xp) for fixed s — let's just compute that.
          let uSum = 0;
          for (let sp = 0; sp < n_S; sp++) for (let xp = 0; xp < n_x; xp++) uSum += Uupery[yy][xp][s][sp];
          const rs = rowSum(Tperx[xs][yy])[r];
          yN[yy] += mass * rs * uSum;
        }
      }
      const tt = yN.reduce((a, b) => a + b, 0);
      if (tt > 0) for (let yy = 0; yy < n_y; yy++) Pcasc_y_next[t * n_y + yy] = yN[yy] / tt;
    }
    // cascX (only x observed): W^(x_t)[(r,s,xs),(rp,sp,xp)] = δ(xs, x_t) · Σ_y T^(y|x_t)[r,rp]·U^(y)(xp|s,sp)
    {
      const newX = new Array(n_full).fill(0);
      for (let r = 0; r < n_R; r++) for (let s = 0; s < n_S; s++) {
        const xs = xObs;
        const old = rhoFullX[r * n_joint + s * n_x + xs];
        if (old === 0) continue;
        for (let rp = 0; rp < n_R; rp++) for (let sp = 0; sp < n_S; sp++) for (let xp = 0; xp < n_x; xp++) {
          let sumY = 0;
          for (let yy = 0; yy < n_y; yy++) sumY += Tperx[xObs][yy][r][rp] * Uupery[yy][xp][s][sp];
          newX[rp * n_joint + sp * n_x + xp] += old * sumY;
        }
      }
      let totX = newX.reduce((a, b) => a + b, 0);
      if (totX > 0) for (let i = 0; i < n_full; i++) newX[i] /= totX;
      rhoFullX = newX;
      for (let i = 0; i < n_full; i++) cascBel_x[t * n_full + i] = rhoFullX[i];
      // Predicted next x at new belief: Σ_{r,s,xs} rhoFullX · Σ_{x_next} W^(x_next) row-sum
      const xN = new Array(n_x).fill(0);
      for (let r = 0; r < n_R; r++) for (let s = 0; s < n_S; s++) for (let xs = 0; xs < n_x; xs++) {
        const mass = rhoFullX[r * n_joint + s * n_x + xs];
        if (mass === 0) continue;
        for (let xn = 0; xn < n_x; xn++) {
          if (xn !== xs) continue;  // gate
          let sumYRp = 0;
          for (let rp = 0; rp < n_R; rp++) for (let yy = 0; yy < n_y; yy++) {
            // U over (sp, xp) sums to 1
            let uSum = 0;
            for (let sp = 0; sp < n_S; sp++) for (let xp = 0; xp < n_x; xp++) uSum += Uupery[yy][xp][s][sp];
            sumYRp += Tperx[xn][yy][r][rp] * uSum;
          }
          xN[xn] += mass * sumYRp;
        }
      }
      const tt = xN.reduce((a, b) => a + b, 0);
      if (tt > 0) for (let xn = 0; xn < n_x; xn++) Pcasc_x_next[t * n_x + xn] = xN[xn] / tt;
    }
  }
  return { Rbel, SXbel, Pnext_x, Pnext_y, n_R, n_S, n_x, n_y, n_joint,
           cascBel_y, cascBel_x, Pcasc_y_next, Pcasc_x_next, n_full };
}

// =====================================================
//  RGB colour mapping from emission distribution
// =====================================================
function emissionColor(P, n_outputs) {
  if (n_outputs === 2) {
    return [Math.max(0, Math.min(1, P[0])), 0, Math.max(0, Math.min(1, P[1]))];
  } else if (n_outputs === 3) {
    return [Math.max(0, Math.min(1, P[0])),
            Math.max(0, Math.min(1, P[1])),
            Math.max(0, Math.min(1, P[2]))];
  }
  return [0.5, 0, 0.5];
}

// =====================================================
//  2-D CANVAS RENDERERS
// =====================================================
function clearMount(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function _setupSharpCanvas(host, displayW, displayH) {
  const c = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  c.width  = Math.round(displayW * dpr);
  c.height = Math.round(displayH * dpr);
  c.style.width  = displayW + 'px';
  c.style.height = displayH + 'px';
  c.className = 'flat-msp';
  host.appendChild(c);
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, displayW, displayH);
  return { c, ctx, W: displayW, H: displayH };
}

function _hostSize(host, fallbackW, fallbackH) {
  const W = host.clientWidth  || fallbackW;
  const H = host.clientHeight || fallbackH;
  return { W, H };
}

function renderPoint(host, P, n_outputs, label) {
  clearMount(host);
  const { W: cW, H: cH } = _hostSize(host, 360, 340);
  const W = Math.min(cW, 360), H = Math.min(cH, 340);
  const { ctx } = _setupSharpCanvas(host, W, H);
  const col = emissionColor(P, n_outputs);
  ctx.fillStyle = `rgb(${col[0]*255},${col[1]*255},${col[2]*255})`;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 22, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = '#444'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label || '0-simplex (single point)', W / 2, H / 2 + 56);
}

function renderLine(host, beliefs, Pnext, n_states, n_outputs, axisLabel) {
  clearMount(host);
  const { W: cW, H: cH } = _hostSize(host, 600, 340);
  const W = cW, H = cH;
  const { ctx } = _setupSharpCanvas(host, W, H);
  const padX = 36, padY = 80, cy = H / 2;
  // axis
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padX, H - padY); ctx.lineTo(W - padX, H - padY); ctx.stroke();
  ctx.fillStyle = '#666'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  for (let t = 0; t <= 5; t++) {
    const xv = t / 5;
    const px = padX + xv * (W - 2 * padX);
    ctx.beginPath(); ctx.moveTo(px, H - padY); ctx.lineTo(px, H - padY + 4); ctx.stroke();
    ctx.fillText(xv.toFixed(2), px, H - padY + 16);
  }
  ctx.fillText(axisLabel || 'η_A', W / 2, H - padY + 36);

  // 1-D fractal "rug": bin η_A into one column per pixel, render with alpha that
  // grows sub-linearly with bin count. Empty bins → background; sparse bins faint;
  // dense bins saturate. Reveals IFS density structure regardless of sample count N.
  const N = beliefs.length / n_states;
  const x0 = padX, x1 = W - padX;
  const nBins = Math.max(1, Math.floor(x1 - x0));
  const count = new Int32Array(nBins);
  const rSum = new Float32Array(nBins), gSum = new Float32Array(nBins), bSum = new Float32Array(nBins);
  for (let t = 0; t < N; t++) {
    const eta_A = beliefs[t * n_states + 0];
    let bin = Math.floor(eta_A * nBins);
    if (bin < 0) bin = 0; else if (bin >= nBins) bin = nBins - 1;
    count[bin] += 1;
    const Pt = []; for (let k = 0; k < n_outputs; k++) Pt.push(Pnext[t * n_outputs + k]);
    const col = emissionColor(Pt, n_outputs);
    rSum[bin] += col[0]; gSum[bin] += col[1]; bSum[bin] += col[2];
  }
  // Sub-linear density mapping: alpha = 1 - exp(-k * count). Choose k so that
  // a bin holding the mean per-bin count of a uniform distribution sits at α≈0.5.
  const meanCount = N / nBins;
  const k = -Math.log(0.5) / Math.max(1e-6, meanCount);
  const tickH = 28;
  const tickHalf = tickH / 2;
  for (let bin = 0; bin < nBins; bin++) {
    const c = count[bin];
    if (c === 0) continue;
    const alpha = 1 - Math.exp(-k * c);
    const r = Math.round(255 * rSum[bin] / c);
    const g = Math.round(255 * gSum[bin] / c);
    const b = Math.round(255 * bSum[bin] / c);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fillRect(x0 + bin, cy - tickHalf, 1, tickH);
  }
}

function renderTriangle(host, beliefs, Pnext, n_states, n_outputs, vlabels) {
  clearMount(host);
  const { W: cW, H: cH } = _hostSize(host, 360, 340);
  const W = Math.min(cW, cH * 1.1), H = Math.min(cH, cW * 1.1);
  const { ctx } = _setupSharpCanvas(host, W, H);
  // Equilateral triangle: edge = side, scaled to fit canvas with margin
  const margin = 30;
  const side = Math.min(W - 2 * margin, (H - 2 * margin - 24) * 2 / Math.sqrt(3));
  const cx = W / 2, cy = H / 2 + 8;
  const h = side * Math.sqrt(3) / 2;
  // Centred equilateral with vertices: bottom-left, bottom-right, top
  const V = [
    [cx - side / 2, cy + h / 3],
    [cx + side / 2, cy + h / 3],
    [cx,            cy - 2 * h / 3],
  ];
  // outline
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1.0;
  ctx.beginPath(); ctx.moveTo(V[0][0], V[0][1]);
  for (let i = 1; i < 3; i++) ctx.lineTo(V[i][0], V[i][1]);
  ctx.closePath(); ctx.stroke();
  // labels
  ctx.fillStyle = '#444'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  const labels = vlabels || ['S₀', 'S₁', 'S₂'];
  ctx.fillText(labels[0], V[0][0] - 4, V[0][1] + 16);
  ctx.fillText(labels[1], V[1][0] + 4, V[1][1] + 16);
  ctx.fillText(labels[2], V[2][0],     V[2][1] - 10);
  // scatter
  const N = beliefs.length / n_states;
  for (let t = 0; t < N; t++) {
    let px = 0, py = 0;
    for (let k = 0; k < 3; k++) {
      const eta_k = beliefs[t * n_states + k];
      px += eta_k * V[k][0];
      py += eta_k * V[k][1];
    }
    const Pt = []; for (let k = 0; k < n_outputs; k++) Pt.push(Pnext[t * n_outputs + k]);
    const col = emissionColor(Pt, n_outputs);
    ctx.fillStyle = `rgba(${col[0]*255},${col[1]*255},${col[2]*255},0.4)`;
    ctx.beginPath(); ctx.arc(px, py, 1.0, 0, Math.PI * 2); ctx.fill();
  }
}

// =====================================================
//  3-D RENDERERS via Three.js
// =====================================================
class ThreeScene {
  constructor(host) {
    clearMount(host);
    this.host = host;
    this.host.innerHTML = '';
    const div = document.createElement('div'); div.className = 'three-host';
    host.appendChild(div);
    // Wait one tick so the div has a layout
    const w = div.clientWidth  || host.clientWidth  || 400;
    const h = div.clientHeight || host.clientHeight || 380;
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(window.devicePixelRatio || 1);
    this.renderer.setClearColor(0xfafafa);
    this.renderer.setSize(w, h, true);  // updateStyle=true so CSS matches buffer aspect
    div.appendChild(this.renderer.domElement);
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(40, w / h, 0.01, 100);
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.div = div;
    const obs = new ResizeObserver(() => {
      const W = div.clientWidth, H = div.clientHeight;
      if (W && H) {
        this.camera.aspect = W / H; this.camera.updateProjectionMatrix();
        this.renderer.setSize(W, H, true);
      }
    });
    obs.observe(div);
    this._anim = () => { requestAnimationFrame(this._anim); this.controls.update(); this.renderer.render(this.scene, this.camera); };
    this._anim();
  }
  clear() {
    while (this.scene.children.length) this.scene.remove(this.scene.children[0]);
  }
  setCameraTo(target, distance) {
    this.controls.target.set(...target);
    this.camera.position.set(target[0] + distance, target[1] + distance * 0.5, target[2] + distance);
  }
  addLine(a, b, color = 0x707070, opacity = 0.55) {
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
    this.scene.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
  }
  addLabel(text, pos) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.strokeStyle = '#999'; ctx.strokeRect(0.5, 0.5, c.width - 1, c.height - 1);
    ctx.fillStyle = 'black'; ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, c.width / 2, c.height / 2);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    sp.scale.set(0.40, 0.10, 1); sp.position.set(...pos);
    this.scene.add(sp);
  }
  addPoints(positions, colors, opacity = 0.55, size = 0.012) {
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('color',    new THREE.BufferAttribute(colors,    3));
    const mat = new THREE.PointsMaterial({ size, vertexColors: true, transparent: true, opacity, sizeAttenuation: true });
    this.scene.add(new THREE.Points(geom, mat));
  }
}

const TETRA_V = [
  [0, 0, 0], [1, 0, 0], [0.5, Math.sqrt(3)/2, 0],
  [0.5, Math.sqrt(3)/6, Math.sqrt(6)/3]
];
const TETRA_EDGES = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];

function renderTetrahedron(host, beliefs, Pnext, n_states, n_outputs, vlabels, downsample = 8000) {
  if (n_states !== 4) { host.innerText = `(no 3-D for ${n_states}-state operator)`; return; }
  const sc = new ThreeScene(host);
  // wireframe
  for (const [i, j] of TETRA_EDGES) sc.addLine(TETRA_V[i], TETRA_V[j]);
  // labels
  const labs = vlabels || ['V₀','V₁','V₂','V₃'];
  const centroid = [0, 0, 0];
  for (const v of TETRA_V) for (let k = 0; k < 3; k++) centroid[k] += v[k] / 4;
  for (let k = 0; k < 4; k++) {
    const dx = (TETRA_V[k][0] - centroid[0]) * 0.18;
    const dy = (TETRA_V[k][1] - centroid[1]) * 0.18;
    const dz = (TETRA_V[k][2] - centroid[2]) * 0.18;
    sc.addLabel(labs[k], [TETRA_V[k][0] + dx, TETRA_V[k][1] + dy, TETRA_V[k][2] + dz]);
  }
  // scatter
  const N = beliefs.length / 4;
  const stride = Math.max(1, Math.floor(N / downsample));
  const M = Math.floor(N / stride);
  const positions = new Float32Array(M * 3);
  const colors    = new Float32Array(M * 3);
  for (let m = 0; m < M; m++) {
    const t = m * stride;
    let px = 0, py = 0, pz = 0;
    for (let k = 0; k < 4; k++) {
      const e = beliefs[t * 4 + k];
      px += e * TETRA_V[k][0];
      py += e * TETRA_V[k][1];
      pz += e * TETRA_V[k][2];
    }
    positions[3 * m] = px; positions[3 * m + 1] = py; positions[3 * m + 2] = pz;
    const Pt = []; for (let k = 0; k < n_outputs; k++) Pt.push(Pnext[t * n_outputs + k]);
    const col = emissionColor(Pt, n_outputs);
    colors[3 * m] = col[0]; colors[3 * m + 1] = col[1]; colors[3 * m + 2] = col[2];
  }
  sc.addPoints(positions, colors);
  sc.setCameraTo(centroid, 2.4);
}

// product helpers
function renderSquare(host, lineL, lineR, Pnext, n_outputs, n_states_R, downsample = 8000) {
  clearMount(host);
  const { W: cW, H: cH } = _hostSize(host, 500, 500);
  const side = Math.min(cW, cH);
  const { ctx } = _setupSharpCanvas(host, side, side);
  const padX = 36, padY = 36;
  const W = side - 2 * padX, H = side - 2 * padY;
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1;
  ctx.strokeRect(padX, padY, W, H);
  ctx.fillStyle = '#666'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('η_A^L  (left memory marginal)', side / 2, side - 8);
  ctx.save();
  ctx.translate(12, side / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('η_A^R  (right marginal)', 0, 0);
  ctx.restore();
  const N = lineL.length;
  const stride = Math.max(1, Math.floor(N / downsample));
  for (let t = 0; t < N; t += stride) {
    const L = lineL[t], R = lineR[t];
    const px = padX + L * W;
    const py = padY + (1 - R) * H;
    const Pt = []; for (let k = 0; k < n_outputs; k++) Pt.push(Pnext[t * n_outputs + k]);
    const col = emissionColor(Pt, n_outputs);
    ctx.fillStyle = `rgba(${col[0]*255},${col[1]*255},${col[2]*255},0.4)`;
    ctx.beginPath(); ctx.arc(px, py, 1.1, 0, Math.PI * 2); ctx.fill();
  }
}

function renderTriangularCylinder(host, lineLineSide, triBeliefs, n_states_tri, Pnext, n_outputs, vlabels, downsample = 8000) {
  // Equilateral triangle (edge length 1) in xy plane, centred at origin; height (z) also 1 → all 9 edges length 1.
  const sc = new ThreeScene(host);
  const sqrt3 = Math.sqrt(3);
  const baseV = [
    [-0.5, -sqrt3 / 6, 0],
    [ 0.5, -sqrt3 / 6, 0],
    [ 0,    sqrt3 / 3, 0],
  ];
  const topV = baseV.map(p => [p[0], p[1], 1.0]);
  // edges (3 base + 3 top + 3 vertical = 9 edges, all length 1)
  for (let i = 0; i < 3; i++) {
    sc.addLine(baseV[i], baseV[(i + 1) % 3]);
    sc.addLine(topV[i],  topV[(i + 1) % 3]);
    sc.addLine(baseV[i], topV[i]);
  }
  const tl = vlabels || ['V₀','V₁','V₂'];
  // labels just outside the corner of the triangle, at top and bottom
  for (let i = 0; i < 3; i++) {
    const out = [baseV[i][0] * 1.30, baseV[i][1] * 1.30, -0.08];
    sc.addLabel(tl[i] + ' (line=0)', out);
    const out2 = [topV[i][0] * 1.30, topV[i][1] * 1.30, 1.08];
    sc.addLabel(tl[i] + ' (line=1)', out2);
  }
  // scatter
  const N = lineLineSide.length;
  const stride = Math.max(1, Math.floor(N / downsample));
  const M = Math.floor(N / stride);
  const positions = new Float32Array(M * 3);
  const colors    = new Float32Array(M * 3);
  for (let m = 0; m < M; m++) {
    const t = m * stride;
    let px = 0, py = 0;
    for (let k = 0; k < 3; k++) {
      const e = triBeliefs[t * n_states_tri + k];
      px += e * baseV[k][0];
      py += e * baseV[k][1];
    }
    const pz = lineLineSide[t];
    positions[3 * m] = px; positions[3 * m + 1] = py; positions[3 * m + 2] = pz;
    const Pt = []; for (let k = 0; k < n_outputs; k++) Pt.push(Pnext[t * n_outputs + k]);
    const col = emissionColor(Pt, n_outputs);
    colors[3 * m] = col[0]; colors[3 * m + 1] = col[1]; colors[3 * m + 2] = col[2];
  }
  sc.addPoints(positions, colors, 0.55, 0.018);
  sc.setCameraTo([0, 0.05, 0.5], 2.0);
}

function drawHMMDiagram(host, arch, params, mode, n_in) {
  clearMount(host);
  const row = document.createElement('div'); row.className = 'row';
  host.appendChild(row);
  const img = document.createElement('img');
  img.src = HMM_IMG[arch]; img.alt = arch;
  row.appendChild(img);
  const text = document.createElement('div'); text.className = 'text';
  let html = `<b>${ARCHS[arch].name}</b> (${mode === 'source' ? 'HMM source' : 'transducer'})<br>`;
  if (mode === 'source') {
    if (arch === 'iid') html += `p(emit 1) = ${(+params.p_1).toFixed(3)}`;
    else if (arch === 'sns') html += `p (self-loop on 0) = ${(+params.p).toFixed(3)}`;
    else if (arch === 'fractal2') html += `b = ${(+params.b).toFixed(2)},  p = ${(+params.p).toFixed(2)},  q = ${(+params.q).toFixed(2)}`;
    else if (arch === 'mess3') html += `α = ${(+params.alpha).toFixed(2)},  x = ${(+params.x).toFixed(3)}`;
  } else {
    for (let x = 0; x < n_in; x++) {
      let line = `y=${x}:  `;
      if (arch === 'iid') line += `p(emit 1) = ${(+params['p_'+x]).toFixed(3)}`;
      else if (arch === 'sns') line += `p (self-loop on 0) = ${(+params['p_'+x]).toFixed(3)}`;
      else if (arch === 'fractal2') line += `b=${(+params['b_'+x]).toFixed(2)},  p=${(+params['p_'+x]).toFixed(2)},  q=${(+params['q_'+x]).toFixed(2)}`;
      else if (arch === 'mess3') line += `α=${(+params['alpha_'+x]).toFixed(2)},  x=${(+params['x_'+x]).toFixed(3)}`;
      html += line + '<br>';
    }
  }
  text.innerHTML = html;
  row.appendChild(text);
}

// =====================================================
function clearChildren(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function makeSlider(parent, key, labelText, min, max, step, def, container) {
  const row = document.createElement('div'); row.className = 'slider-row';
  const lab = document.createElement('div'); lab.className = 'label'; lab.textContent = labelText;
  const inp = document.createElement('input'); inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = def;
  const val = document.createElement('div'); val.className = 'val'; val.textContent = (+def).toFixed(2);
  row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
  parent.appendChild(row);
  inp.addEventListener('input', () => { val.textContent = (+inp.value).toFixed(2); container[key] = +inp.value; rerunDebounced(); });
  container[key] = +def;
  return inp;
}

function buildSourceSliders(host, arch, params) {
  clearChildren(host);
  if (arch === 'iid') {
    const grp = document.createElement('div'); grp.className = 'group-hdr'; grp.textContent = 'p(emit 1)';
    host.appendChild(grp);
    makeSlider(host, 'p_1', 'p₁', 0.01, 0.99, 0.01, 0.5, params);
  } else if (arch === 'sns') {
    const grp = document.createElement('div'); grp.className = 'group-hdr'; grp.textContent = 'SNS HMM (self-loop prob p)';
    host.appendChild(grp);
    makeSlider(host, 'p', 'p', 0.01, 0.99, 0.01, 0.5, params);
  } else if (arch === 'fractal2') {
    const grp = document.createElement('div'); grp.className = 'group-hdr'; grp.textContent = 'Fractal-2-state HMM (b, p, q)';
    host.appendChild(grp);
    makeSlider(host, 'b', 'b',  0.01, 0.99, 0.01, 0.5, params);
    makeSlider(host, 'p', 'p',  0.01, 0.99, 0.01, 0.5, params);
    makeSlider(host, 'q', 'q',  0.01, 0.99, 0.01, 0.5, params);
  } else if (arch === 'mess3') {
    const grp = document.createElement('div'); grp.className = 'group-hdr'; grp.textContent = 'Mess3 HMM (α, x)';
    host.appendChild(grp);
    makeSlider(host, 'alpha', 'α', 0.34, 0.99, 0.01, 0.85, params);
    makeSlider(host, 'x',     'x', 0.001, 0.499, 0.001, 0.05, params);
  }
}

function buildTransducerSliders(host, arch, n_in, params) {
  clearChildren(host);
  for (let x = 0; x < n_in; x++) {
    const grp = document.createElement('div'); grp.className = 'group-hdr';
    grp.textContent = `input y=${x}  →  agent params`;
    host.appendChild(grp);
    if (arch === 'iid') {
      makeSlider(host, `p_${x}`, `p₁|y=${x}`, 0.01, 0.99, 0.01, x === 0 ? 0.25 : 0.75, params);
    } else if (arch === 'sns') {
      makeSlider(host, `p_${x}`, `p|y=${x}`, 0.01, 0.99, 0.01, x === 0 ? 0.4 : 0.7, params);
    } else if (arch === 'fractal2') {
      makeSlider(host, `b_${x}`, `b|y=${x}`, 0.01, 0.99, 0.01, x === 0 ? 0.25 : 0.75, params);
      makeSlider(host, `p_${x}`, `p|y=${x}`, 0.01, 0.99, 0.01, x === 0 ? 0.25 : 0.75, params);
      makeSlider(host, `q_${x}`, `q|y=${x}`, 0.01, 0.99, 0.01, x === 0 ? 0.25 : 0.75, params);
    } else if (arch === 'mess3') {
      makeSlider(host, `alpha_${x}`, `α|y=${x}`,  0.34, 0.99, 0.01, x === 0 ? 0.85 : 0.50, params);
      makeSlider(host, `x_${x}`,     `x|y=${x}`,  0.001, 0.499, 0.001, x === 0 ? 0.05 : 0.10, params);
    }
  }
}

function buildFeedbackTSliders(host, arch, n_in, params) {
  // T as a transducer with input alphabet n_in (= U's output alphabet)
  buildTransducerSliders(host, arch, n_in, params);
}

const state = {
  mode: 'feedforward',
  leftArch: 'fractal2',
  rightArch: 'fractal2',
  leftParams: {},
  rightParams: {},
  nSteps: 20000,
  seed: 0,
};

let _runId = 0;
let _debounceTimer = null;
function rerunDebounced() {
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(rerun, 80);
}

function rerun() {
  const myId = ++_runId;
  document.getElementById('status').textContent = ' simulating…';
  // schedule on next animation frame so UI updates
  requestAnimationFrame(() => {
    if (myId !== _runId) return;
    const t0 = performance.now();
    runOnce();
    const dt = performance.now() - t0;
    document.getElementById('status').textContent = ` ${dt.toFixed(0)} ms`;
  });
}

function runOnce() {
  const N = state.nSteps;
  if (state.mode === 'feedforward') runFeedforward(N);
  else                              runFeedback(N);
}

function infoLine(text) { document.getElementById('info-line').innerHTML = text; }

// =====================================================
//  Singular-value diagnostic (PCA-equivalent: SVD of centred data)
//  See handbook/svd.md.  Plot sits beside each MSP figure.
// =====================================================
function _centeredGram(beliefs, D, N) {
  // Returns D × D Gram matrix of the centered belief data divided by N
  // (i.e. the covariance). Eigenvalues are σ_k² / N at PCA-style scaling.
  const mean = new Array(D).fill(0);
  for (let t = 0; t < N; t++) for (let i = 0; i < D; i++) mean[i] += beliefs[t * D + i];
  for (let i = 0; i < D; i++) mean[i] /= N;
  const M = Array.from({ length: D }, () => new Array(D).fill(0));
  for (let t = 0; t < N; t++) {
    for (let i = 0; i < D; i++) {
      const vi = beliefs[t * D + i] - mean[i];
      for (let j = i; j < D; j++) {
        M[i][j] += vi * (beliefs[t * D + j] - mean[j]);
      }
    }
  }
  for (let i = 0; i < D; i++) {
    M[i][i] /= N;
    for (let j = i + 1; j < D; j++) { M[i][j] /= N; M[j][i] = M[i][j]; }
  }
  return M;
}

function _eigenvaluesJacobi(M_) {
  // Jacobi cyclic rotations on a symmetric D × D matrix — returns eigenvalues sorted descending.
  const D = M_.length;
  const M = M_.map(row => row.slice());
  for (let iter = 0; iter < 300; iter++) {
    let p = 0, q = 1, max = 0;
    for (let i = 0; i < D; i++) for (let j = i + 1; j < D; j++) {
      const v = Math.abs(M[i][j]);
      if (v > max) { max = v; p = i; q = j; }
    }
    if (max < 1e-14) break;
    const a = M[p][p], b = M[q][q], pq = M[p][q];
    const theta = (b - a) / (2 * pq);
    let t;
    if (Math.abs(theta) > 1e15) t = 1 / (2 * theta);
    else {
      const sg = theta >= 0 ? 1 : -1;
      t = sg / (Math.abs(theta) + Math.sqrt(theta * theta + 1));
    }
    const c = 1 / Math.sqrt(1 + t * t);
    const s = t * c;
    M[p][p] = a - t * pq;
    M[q][q] = b + t * pq;
    M[p][q] = 0; M[q][p] = 0;
    for (let i = 0; i < D; i++) {
      if (i !== p && i !== q) {
        const Mip = M[i][p], Miq = M[i][q];
        M[i][p] = c * Mip - s * Miq; M[p][i] = M[i][p];
        M[i][q] = s * Mip + c * Miq; M[q][i] = M[i][q];
      }
    }
  }
  const eigs = [];
  for (let i = 0; i < D; i++) eigs.push(Math.max(0, M[i][i]));
  eigs.sort((a, b) => b - a);
  return eigs;
}

function singularValuesPCA(beliefs, D, N) {
  // PCA-equivalent singular values of the centred data matrix. Constant of proportionality
  // is dropped — only the *ratio* of σ values matters for dimension diagnostics.
  if (D === 1 || N === 0) return [0];
  const M = _centeredGram(beliefs, D, N);
  const eigs = _eigenvaluesJacobi(M);
  return eigs.map(e => Math.sqrt(Math.max(0, e)));
}

// =====================================================
//  Four linear-algebraic dimensions (handbook/embedding_complexity.md §6)
//   D          — generator size
//   M_T̄        — rank([T^(0) | T^(1) | ... ])         (single-step image)
//   dim F      — forward-reachable subspace dim       (subspace tracking)
//   M_min      — rank(F · G)                          (Hankel rank via stabilised bases)
// All kernels in row convention: η T applies row vector on the right of T.
// =====================================================
function _rowVecMat_RC(v, T) {
  const D = T.length;
  const out = new Array(D).fill(0);
  for (let i = 0; i < D; i++) for (let j = 0; j < D; j++) out[j] += v[i] * T[i][j];
  return out;
}
function _matCol_RC(T, c) {
  const D = T.length;
  const out = new Array(D).fill(0);
  for (let i = 0; i < D; i++) for (let j = 0; j < D; j++) out[i] += T[i][j] * c[j];
  return out;
}
function _normalizeVec(v) {
  let n2 = 0;
  for (let i = 0; i < v.length; i++) n2 += v[i] * v[i];
  const n = Math.sqrt(n2);
  if (n < 1e-15) return null;
  const out = new Array(v.length);
  for (let i = 0; i < v.length; i++) out[i] = v[i] / n;
  return out;
}
function _dotVec(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += a[i] * b[i];
  return s;
}
function _gramSmaller(A) {
  // For an m×n matrix A, return the smaller of A A^T (m×m) or A^T A (n×n).
  const m = A.length;
  if (m === 0) return [[]];
  const n = A[0].length;
  if (n === 0) return [[]];
  if (m <= n) {
    const G = Array.from({ length: m }, () => new Array(m).fill(0));
    for (let i = 0; i < m; i++) for (let j = i; j < m; j++) {
      let s = 0;
      for (let k = 0; k < n; k++) s += A[i][k] * A[j][k];
      G[i][j] = s; G[j][i] = s;
    }
    return G;
  }
  const G = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) for (let j = i; j < n; j++) {
    let s = 0;
    for (let k = 0; k < m; k++) s += A[k][i] * A[k][j];
    G[i][j] = s; G[j][i] = s;
  }
  return G;
}
function _numericalRank(A, relTol = 1e-9) {
  const m = A.length;
  if (m === 0 || (A[0] && A[0].length === 0)) return 0;
  const G = _gramSmaller(A);
  const eigs = _eigenvaluesJacobi(G);
  const maxE = Math.max(eigs[0] || 0, 1e-30);
  const tol = relTol * maxE;
  return eigs.filter(e => e > tol).length;
}

// Forward orthonormal basis of span{ρ_R · T^(w)}: rows of returned array.
function _forwardBasis(rho_R, T_list, tol = 1e-10) {
  if (!rho_R || rho_R.length === 0) return [];
  const D = rho_R.length;
  const start = _normalizeVec(rho_R);
  if (!start) return [];
  const basis = [start];
  for (let iter = 0; iter < D + 1; iter++) {
    const candidates = [];
    for (const T of T_list) for (const v of basis) candidates.push(_rowVecMat_RC(v, T));
    let added = 0;
    for (const c of candidates) {
      const w = c.slice();
      for (const b of basis) {
        const d = _dotVec(w, b);
        for (let i = 0; i < D; i++) w[i] -= d * b[i];
      }
      const n = Math.sqrt(_dotVec(w, w));
      if (n > tol) {
        for (let i = 0; i < D; i++) w[i] /= n;
        basis.push(w);
        added++;
      }
    }
    if (added === 0) break;
  }
  return basis;
}

// Backward orthonormal basis of span{T^(w') · 1}: columns stored as length-D arrays.
function _backwardBasis(D, T_list, tol = 1e-10) {
  if (D === 0) return [];
  const ones = new Array(D).fill(1);
  const start = _normalizeVec(ones);
  if (!start) return [];
  const basis = [start];
  for (let iter = 0; iter < D + 1; iter++) {
    const candidates = [];
    for (const T of T_list) for (const c of basis) candidates.push(_matCol_RC(T, c));
    let added = 0;
    for (const cand of candidates) {
      const w = cand.slice();
      for (const b of basis) {
        const d = _dotVec(w, b);
        for (let i = 0; i < D; i++) w[i] -= d * b[i];
      }
      const n = Math.sqrt(_dotVec(w, w));
      if (n > tol) {
        for (let i = 0; i < D; i++) w[i] /= n;
        basis.push(w);
        added++;
      }
    }
    if (added === 0) break;
  }
  return basis;
}

// General dense matrix product (A: m×k, B: k×n).
function _matMul(A, B) {
  const m = A.length, k = B.length, n = B[0].length;
  const C = Array.from({ length: m }, () => new Array(n).fill(0));
  for (let i = 0; i < m; i++) for (let l = 0; l < k; l++) {
    const ail = A[i][l];
    if (ail === 0) continue;
    for (let j = 0; j < n; j++) C[i][j] += ail * B[l][j];
  }
  return C;
}

// Jacobi eigendecomposition of a symmetric matrix: returns {values, vectors} sorted descending.
// vectors[k] is the k-th eigenvector (length-D array).
function _jacobiEigSym(Min) {
  const D = Min.length;
  const M = Min.map(r => r.slice());
  const V = Array.from({ length: D }, (_, i) => { const r = new Array(D).fill(0); r[i] = 1; return r; });
  for (let iter = 0; iter < 400; iter++) {
    let p = 0, q = 1, max = 0;
    for (let i = 0; i < D; i++) for (let j = i + 1; j < D; j++) {
      const v = Math.abs(M[i][j]);
      if (v > max) { max = v; p = i; q = j; }
    }
    if (max < 1e-14) break;
    const a = M[p][p], b = M[q][q], pq = M[p][q];
    const theta = (b - a) / (2 * pq);
    let t;
    if (Math.abs(theta) > 1e15) t = 1 / (2 * theta);
    else { const sg = theta >= 0 ? 1 : -1; t = sg / (Math.abs(theta) + Math.sqrt(theta * theta + 1)); }
    const c = 1 / Math.sqrt(1 + t * t), s = t * c;
    M[p][p] = a - t * pq; M[q][q] = b + t * pq; M[p][q] = 0; M[q][p] = 0;
    for (let i = 0; i < D; i++) {
      if (i !== p && i !== q) {
        const Mip = M[i][p], Miq = M[i][q];
        M[i][p] = c * Mip - s * Miq; M[p][i] = M[i][p];
        M[i][q] = s * Mip + c * Miq; M[q][i] = M[i][q];
      }
      const Vip = V[i][p], Viq = V[i][q];
      V[i][p] = c * Vip - s * Viq;
      V[i][q] = s * Vip + c * Viq;
    }
  }
  const idx = Array.from({ length: D }, (_, i) => i).sort((a, b) => M[b][b] - M[a][a]);
  return { values: idx.map(i => M[i][i]), vectors: idx.map(i => V.map(row => row[i])) };
}

// Symmetric PSD square root via eigendecomposition.
function _matSqrtPSD(M) {
  const D = M.length;
  const { values, vectors } = _jacobiEigSym(M);
  const sq = values.map(v => Math.sqrt(Math.max(0, v)));
  const R = Array.from({ length: D }, () => new Array(D).fill(0));
  for (let i = 0; i < D; i++) for (let j = 0; j < D; j++) {
    let s = 0;
    for (let k = 0; k < D; k++) s += vectors[k][i] * sq[k] * vectors[k][j];
    R[i][j] = s;
  }
  return R;
}

// Direct Hankel singular values:  Ĥ_{w',w} = ⟨1| T^(w') T^(w) |ρ_R⟩, words up to length D-1.
// Returns the singular values of Ĥ (descending), or null if too many words to enumerate.
function hankelSingularValuesDirect(T_list, rho_R, maxWords = 4000) {
  const D = T_list[0].length;
  if (D === 1) return [1];
  const N = T_list.length;
  // word count = (N^D - 1)/(N - 1) for words of length 0..D-1
  let nWords = 0; { let p = 1; for (let L = 0; L < D; L++) { nWords += p; p *= N; } }
  if (nWords > maxWords) return null;
  const ones = new Array(D).fill(1);
  // Enumerate words length 0..D-1; accumulate Gram matrices G_F = Σ f_w f_wᵀ, G_B = Σ b_w b_wᵀ.
  const GF = Array.from({ length: D }, () => new Array(D).fill(0));
  const GB = Array.from({ length: D }, () => new Array(D).fill(0));
  let level = [[]];
  for (let L = 0; L <= D - 1; L++) {
    for (const w of level) {
      // forward word vector: ρ_R T^(w_0) … T^(w_{L-1})  (row vector)
      let f = rho_R.slice();
      for (const x of w) f = _rowVecMat_RC(f, T_list[x]);
      // backward word vector: T^(w_0) … T^(w_{L-1}) 1  (column; apply in reverse)
      let b = ones.slice();
      for (let k = w.length - 1; k >= 0; k--) b = _matCol_RC(T_list[w[k]], b);
      for (let i = 0; i < D; i++) for (let j = 0; j < D; j++) {
        GF[i][j] += f[i] * f[j];
        GB[i][j] += b[i] * b[j];
      }
    }
    if (L < D - 1) {
      const next = [];
      for (const w of level) for (let x = 0; x < N; x++) next.push([...w, x]);
      level = next;
    }
  }
  // σ²(Ĥ) = eigenvalues of G_F^{1/2} G_B G_F^{1/2}
  const A = _matSqrtPSD(GF);
  const M2 = _matMul(_matMul(A, GB), A);
  const { values } = _jacobiEigSym(M2);
  return values.map(v => Math.sqrt(Math.max(0, v)));
}

function computeFourDims(T_list, rho_R) {
  // Returns { D, M_T_bar, dim_F, M_min, hankel_sigmas }.
  // T_list: array of D×D substochastic matrices (row convention).
  // rho_R:  initial state, length-D row vector (typically stationary of Σ_x T^(x)).
  if (!T_list || T_list.length === 0) return { D: 0, M_T_bar: 0, dim_F: 0, M_min: 0, hankel_sigmas: [] };
  const D = T_list[0].length;
  if (D === 0) return { D: 0, M_T_bar: 0, dim_F: 0, M_min: 0, hankel_sigmas: [] };
  if (D === 1) return { D: 1, M_T_bar: 1, dim_F: 1, M_min: 1, hankel_sigmas: [1] };
  const N = T_list.length;
  // M_T̄: rank of horizontal stack [T^(0) | T^(1) | ... | T^(N-1)] (D × DN)
  const stacked = Array.from({ length: D }, () => new Array(D * N).fill(0));
  for (let x = 0; x < N; x++) for (let i = 0; i < D; i++) for (let j = 0; j < D; j++) {
    stacked[i][x * D + j] = T_list[x][i][j];
  }
  const M_T_bar = _numericalRank(stacked);
  // dim F via incremental subspace tracking
  const F = _forwardBasis(rho_R, T_list);
  const dim_F = F.length;
  // dim G via dual subspace tracking
  const G = _backwardBasis(D, T_list);
  const dim_G = G.length;
  if (dim_F === 0 || dim_G === 0) return { D, M_T_bar, dim_F, M_min: 0, hankel_sigmas: [] };

  // Hankel singular values — prefer the DIRECT construction Ĥ_{w',w} = ⟨1|T^(w')T^(w)|ρ_R⟩
  // (words up to length D-1), which preserves magnitudes.  Fall back to the orthonormal-basis
  // pairing rank only when too many words to enumerate (large joint state spaces).
  const directSigmas = hankelSingularValuesDirect(T_list, rho_R);
  let hankel_sigmas, M_min;
  if (directSigmas) {
    hankel_sigmas = directSigmas;
    const maxS = Math.max(hankel_sigmas[0] || 0, 1e-30);
    M_min = hankel_sigmas.filter(s => s > 1e-9 * maxS).length;
  } else {
    // Fallback: rank only (magnitudes are principal-angle cosines, not informative).
    const pairing = Array.from({ length: dim_F }, (_, i) => G.map(g => _dotVec(F[i], g)));
    M_min = _numericalRank(pairing);
    hankel_sigmas = [];
  }
  return { D, M_T_bar, dim_F, M_min, hankel_sigmas };
}

// =====================================================
//  SVD + dimensions chart
// =====================================================
function renderSVDChart(host, sigmas, label, tau = 0.01, dims = null) {
  // Compact panel: optional dims header on top + horizontal bar chart of σ_k / σ_0 below.
  clearMount(host);
  const D = sigmas.length;
  const W = 138;
  const hdrH = dims ? 48 : 0;                                      // 2 lines + divider
  const rowH = 18, top = 22 + hdrH, bot = 22;
  const H = Math.max(120 + hdrH, top + D * rowH + bot);
  const { ctx } = _setupSharpCanvas(host, W, H);
  // ----- Dims header -----
  if (dims) {
    ctx.fillStyle = '#666'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Dimensions', 6, 13);
    ctx.fillStyle = '#222'; ctx.font = '10px monospace';
    ctx.fillText(`D=${dims.D}`,            6, 27);
    ctx.fillText(`Mₜ̄=${dims.M_T_bar}`, 70, 27);          // M with subscript t and combining macron approximation
    ctx.fillText(`dim F=${dims.dim_F}`,    6, 40);
    ctx.fillText(`M_min=${dims.M_min}`,    70, 40);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 22 + hdrH - 4); ctx.lineTo(W, 22 + hdrH - 4); ctx.stroke();
  }
  // ----- σ chart title -----
  ctx.fillStyle = '#666'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(label || 'σₖ (Hankel)', 6, top - 9);
  const maxSig = sigmas[0] > 0 ? sigmas[0] : 1;
  const x0 = 22, x1 = W - 8;
  let effRank = 0;
  for (let k = 0; k < D; k++) {
    const r = sigmas[k] / maxSig;
    const y = top + k * rowH;
    ctx.fillStyle = '#666'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`σ${_sub(k)}`, x0 - 3, y + 11);
    ctx.fillStyle = '#eee'; ctx.fillRect(x0, y + 3, x1 - x0, 12);
    const above = r > tau;
    ctx.fillStyle = above ? '#2c6aa0' : '#bbb';
    ctx.fillRect(x0, y + 3, Math.max(1, (x1 - x0) * r), 12);
    if (above) effRank++;
    ctx.fillStyle = '#333'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
    const txt = r >= 0.01 ? r.toFixed(2) : (r < 1e-6 ? '0' : r.toExponential(0));
    ctx.fillText(txt, x0 + 2, y + 13);
  }
  ctx.fillStyle = '#444'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`eff. rank ≈ ${effRank}`, 6, top + D * rowH + 12);
  ctx.fillStyle = '#888'; ctx.font = '9px sans-serif';
  ctx.fillText(`(τ = ${tau})`, 6, top + D * rowH + 22);
}

function _sub(k) {
  const map = '₀₁₂₃₄₅₆₇₈₉';
  return String(k).split('').map(c => map[+c] || c).join('');
}

// Convenience: compute + render for a panel.  Optional `dims` is the four-tuple from computeFourDims().
function svdPanel(svdHostId, beliefs, D, N, label, dims = null) {
  const host = document.getElementById(svdHostId);
  if (!host) return;
  // Prefer the Hankel singular values from `dims` when available (this is what we
  // actually want to diagnose M_min).  Fall back to PCA-of-belief-samples only if
  // the dims object wasn't supplied — useful for debugging.
  let sigmas;
  if (dims && dims.hankel_sigmas && dims.hankel_sigmas.length > 0) {
    sigmas = dims.hankel_sigmas;
  } else if (!beliefs || D <= 1) {
    sigmas = [0];
  } else {
    sigmas = singularValuesPCA(beliefs, D, N);
  }
  renderSVDChart(host, sigmas, label, 0.01, dims);
}

// =====================================================
//  Coarse-grained MSP panels (rendered below the product MSP)
// =====================================================
function expandJointLabels(lDim, rDim) {
  const lab = [];
  const rNames = ['A', 'B', 'C']; const sNames = ['0', '1', '2'];
  for (let i = 0; i < lDim; i++) for (let j = 0; j < rDim; j++)
    lab.push(`(r=${rNames[i] || i}, s=${sNames[j] || j})`);
  return lab;
}

function _renderSimplexAuto(host, beliefs, Pnext, n_states, n_outputs, axisLabel, vlabels) {
  // Auto-pick renderer by dimension. Handles 1→point, 2→line, 3→triangle, 4→tetrahedron.
  // Higher dims fall back to a "unsupported" notice.
  clearMount(host);
  if (n_states <= 1) {
    const Pt0 = []; for (let k = 0; k < n_outputs; k++) Pt0.push(Pnext[(beliefs.length / n_states - 1) * n_outputs + k]);
    renderPoint(host, Pt0, n_outputs, '0-simplex (degenerate)');
  } else if (n_states === 2) {
    renderLine(host, beliefs, Pnext, n_states, n_outputs, axisLabel || 'η₀');
  } else if (n_states === 3) {
    renderTriangle(host, beliefs, Pnext, n_states, n_outputs);
  } else if (n_states === 4) {
    renderTetrahedron(host, beliefs, Pnext, n_states, n_outputs, vlabels);
  } else {
    host.innerHTML = `<div style="text-align:center;color:#a30;font-size:13px;padding:30px">
      Joint state-space dim is ${n_states} — direct simplex visualisation supported up to dim 4 (tetrahedron).<br>
      For higher dims, drop to a 1-state input or use the marginal projections in the panels above.</div>`;
  }
}

function renderCoarse(mode, leftDim, rightDim,
                     leftBel, leftP, leftN, leftNo,
                     rightBel, rightP, rightN, rightNo,
                     leftAxisLab, rightAxisLab,
                     leftVlabels, rightVlabels) {
  const wrap  = document.getElementById('coarse-wrap');
  const lHost = document.getElementById('coarse-output-msp');
  const rHost = document.getElementById('coarse-input-msp');
  const lTitle = document.getElementById('coarse-output-title');
  const rTitle = document.getElementById('coarse-input-title');
  wrap.style.display = '';
  if (mode === 'feedforward') {
    lTitle.innerHTML = `Coarse-grain output <span class="sub">(only y observed → MSP = input HMM's MSP, Δ^${leftN-1})</span>`;
    rTitle.innerHTML = `Coarse-grain input <span class="sub">(only x observed → joint cascade MSP, Δ^${rightN-1})</span>`;
  } else {
    lTitle.innerHTML = `Coarse-grain U's output <span class="sub">(only y from T observed → joint (R,S,X) cascade, Δ^${leftN-1})</span>`;
    rTitle.innerHTML = `Coarse-grain T's output <span class="sub">(only x from U observed → joint (R,S,X) cascade, Δ^${rightN-1})</span>`;
  }
  _renderSimplexAuto(lHost, leftBel,  leftP,  leftN,  leftNo,  leftAxisLab,  leftVlabels);
  _renderSimplexAuto(rHost, rightBel, rightP, rightN, rightNo, rightAxisLab, rightVlabels);
}

function runFeedforward(N) {
  // LEFT = HMM source (no input). RIGHT = transducer with input from LEFT.
  const lArch = state.leftArch, rArch = state.rightArch;
  const lP = state.leftParams, rP = state.rightParams;
  // HMM schematics
  drawHMMDiagram(document.getElementById('left-hmm'),  lArch, lP, 'source', 0);
  drawHMMDiagram(document.getElementById('right-hmm'), rArch, rP, 'transducer', ARCHS[lArch].n_outputs);
  // build LEFT kernel
  let Tinput;
  if (lArch === 'iid')           Tinput = kernel_iid_source(lP.p_1);
  else if (lArch === 'sns')      Tinput = kernel_sns_source(lP.p);
  else if (lArch === 'fractal2') Tinput = kernel_fractal2_source(lP.b, lP.p, lP.q);
  else                           Tinput = kernel_mess3_source(lP.x, lP.alpha);
  const n_in_emit = Tinput.length; // LEFT output alphabet → transducer input alphabet
  // build RIGHT kernel as transducer with input alphabet = n_in_emit
  let Tperinput;
  if (rArch === 'iid')           Tperinput = transducer_iid(rP, n_in_emit);
  else if (rArch === 'sns')      Tperinput = transducer_sns(rP, n_in_emit);
  else if (rArch === 'fractal2') Tperinput = transducer_fractal2(rP, n_in_emit);
  else                           Tperinput = transducer_mess3(rP, n_in_emit);
  // sample joint
  const out = sampleDrivenTransducer(Tinput, Tperinput, N, state.seed);

  // LEFT panel: input HMM's MSP — plot beliefs marginalized to LEFT's R-state alone
  // (= input marginal = inputBel)
  const lDim = ARCHS[lArch].n_states;
  const rDim = ARCHS[rArch].n_states;
  document.getElementById('left-dim').textContent  = `(operator dim ${lDim})`;
  document.getElementById('right-dim').textContent = `(operator dim ${rDim})`;
  document.getElementById('left-panel-title').textContent  = `Left (${ARCHS[lArch].name}) MSP — η on Δ^${lDim - 1}`;
  document.getElementById('right-panel-title').textContent = `Right (${ARCHS[rArch].name}) MSP — marginal over input`;

  const leftHost = document.getElementById('left-msp');
  const rightHost = document.getElementById('right-msp');

  // ----- Pre-compute the four linear-algebraic dimensions for every panel -----
  // (handbook/embedding_complexity.md §6).  Each panel needs a kernel list T_list
  // and a stationary initial state ρ_R.
  // LEFT: the input HMM alone (kernels T^(y) on R).
  const rho_left = stationary(matSum(Tinput));
  const dims_left = computeFourDims(Tinput, rho_left);
  // RIGHT: effective HMM on S obtained by averaging the transducer's per-input
  // kernels against the LEFT's stationary y-emission distribution.
  const pi_y = new Array(out.n_y).fill(0);
  for (let y = 0; y < out.n_y; y++) {
    const rs = rowSum(Tinput[y]);
    for (let i = 0; i < out.n_in; i++) pi_y[y] += rho_left[i] * rs[i];
  }
  const Tlist_right = [];
  for (let x = 0; x < out.n_x; x++) {
    const M = Array.from({ length: out.n_S }, () => new Array(out.n_S).fill(0));
    for (let y = 0; y < out.n_y; y++) {
      const A = Tperinput[y][x];
      for (let i = 0; i < out.n_S; i++) for (let j = 0; j < out.n_S; j++) M[i][j] += pi_y[y] * A[i][j];
    }
    Tlist_right.push(M);
  }
  const rho_right = stationary(matSum(Tlist_right));
  const dims_right = computeFourDims(Tlist_right, rho_right);
  // Joint product: V^(y,x) = T^(y) ⊗ U^(x|y) on R⊗S.
  const Tlist_joint = [];
  for (let y = 0; y < out.n_y; y++) for (let x = 0; x < out.n_x; x++) {
    Tlist_joint.push(tensorKron(Tinput[y], Tperinput[y][x]));
  }
  const rho_joint = stationary(matSum(Tlist_joint));
  const dims_joint = computeFourDims(Tlist_joint, rho_joint);
  // Cascade (coarse-grain y): W^(x) = Σ_y V^(y,x).
  const Tlist_cascade = [];
  for (let x = 0; x < out.n_x; x++) {
    const M = Array.from({ length: out.n_joint }, () => new Array(out.n_joint).fill(0));
    for (let y = 0; y < out.n_y; y++) {
      const K = Tlist_joint[y * out.n_x + x];
      for (let i = 0; i < out.n_joint; i++) for (let j = 0; j < out.n_joint; j++) M[i][j] += K[i][j];
    }
    Tlist_cascade.push(M);
  }
  const dims_cascade = computeFourDims(Tlist_cascade, rho_joint);

  // LEFT: render based on lDim.  For the input source, ρ^L_t is just inputBel.
  if (lDim === 1) {
    // single point — colour by predicted next-input emission (= L's emission)
    const Pt0 = []; for (let k = 0; k < out.n_y; k++) Pt0.push(out.PmargIn[(N - 1) * out.n_y + k]);
    renderPoint(leftHost, Pt0, out.n_y, '0-simplex (memoryless source)');
  } else if (lDim === 2) {
    renderLine(leftHost, out.inputBel, out.PmargIn, out.n_in, out.n_y, 'η_A^{input}');
  } else {
    renderTriangle(leftHost, out.inputBel, out.PmargIn, out.n_in, out.n_y);
  }
  svdPanel('left-svd', out.inputBel, out.n_in, N, 'σₖ — R (input)', dims_left);

  // RIGHT: marginal over right's transducer states (trBel)
  if (rDim === 1) {
    const Pt0 = []; for (let k = 0; k < out.n_x; k++) Pt0.push(out.PmargOut[(N - 1) * out.n_x + k]);
    renderPoint(rightHost, Pt0, out.n_x, '0-simplex (memoryless transducer)');
  } else if (rDim === 2) {
    renderLine(rightHost, out.trBel, out.PmargOut, out.n_S, out.n_x, 'η_A^{trans}');
  } else {
    renderTriangle(rightHost, out.trBel, out.PmargOut, out.n_S, out.n_x);
  }
  svdPanel('right-svd', out.trBel, out.n_S, N, 'σₖ — S (trans.)', dims_right);

  // Product simplex
  const productWrap = document.getElementById('product-wrap');
  const productTitle = document.getElementById('product-title');
  const productHost  = document.getElementById('product-msp');
  if (lDim === 2 && rDim === 2) {
    productWrap.style.display = '';
    productTitle.textContent = `Joint marginals (η_A^L , η_A^R) — square product simplex`;
    // extract η_A from each side
    const lA = new Float32Array(N), rA = new Float32Array(N);
    for (let t = 0; t < N; t++) { lA[t] = out.inputBel[t * out.n_in]; rA[t] = out.trBel[t * out.n_S]; }
    renderSquare(productHost, lA, rA, out.PmargOut, out.n_x, out.n_S);
  } else if ((lDim === 2 && rDim === 3) || (lDim === 3 && rDim === 2)) {
    productWrap.style.display = '';
    productTitle.textContent = `Joint marginals — triangular cylinder (drag to rotate)`;
    let lineSide, triBel, n_tri;
    if (lDim === 2) {
      lineSide = new Float32Array(N);
      for (let t = 0; t < N; t++) lineSide[t] = out.inputBel[t * out.n_in];
      triBel = out.trBel; n_tri = out.n_S;
    } else {
      lineSide = new Float32Array(N);
      for (let t = 0; t < N; t++) lineSide[t] = out.trBel[t * out.n_S];
      triBel = out.inputBel; n_tri = out.n_in;
    }
    renderTriangularCylinder(productHost, lineSide, triBel, n_tri, out.PmargOut, out.n_x);
  } else {
    productWrap.style.display = 'none';
  }
  // SVD + dims of the joint product belief (lives on the product sub-manifold of Δ^{n_joint-1}).
  if (productWrap.style.display !== 'none') {
    svdPanel('product-svd', out.jointBel, out.n_joint, N, 'σₖ — joint product', dims_joint);
  }

  // ----- Coarse-grained MSPs -----
  // Left  panel (coarse-grain output / only y observed): MSP collapses to the input HMM's MSP on R, dim lDim.
  // Right panel (coarse-grain input  / only x observed): joint cascade MSP on R⊗S, dim n_joint = lDim·rDim.
  renderCoarse(
    'feedforward', lDim, out.n_joint,
    out.inputBel, out.PmargIn, out.n_in, out.n_y,                // coarse-output: R-only MSP
    out.cascBel,  out.PcascX,  out.n_joint, out.n_x,             // coarse-input: cascade joint MSP
    `R-belief — input HMM's MSP, η on Δ^${lDim - 1}`,
    `Joint cascade belief over R⊗S — η on Δ^${out.n_joint - 1}`,
    ['R₀', 'R₁', 'R₂'],
    expandJointLabels(lDim, rDim),
  );
  svdPanel('coarse-output-svd', out.inputBel, out.n_in, N, 'σₖ — only-y', dims_left);
  svdPanel('coarse-input-svd',  out.cascBel,  out.n_joint, N, 'σₖ — cascade', dims_cascade);

  infoLine(`<b>Mode:</b> feed-forward · LEFT=${ARCHS[lArch].name} (dim ${lDim}) · RIGHT=${ARCHS[rArch].name} (dim ${rDim}) · joint state space ${out.n_in}×${out.n_S} = ${out.n_in*out.n_S}.`);
}

function runFeedback(N) {
  // LEFT = T (transducer), input = RIGHT's output. RIGHT = U (modified op MSP).
  const lArch = state.leftArch, rArch = state.rightArch;
  const lP = state.leftParams, rP = state.rightParams;
  // U output alphabet = n_x → T input alphabet
  const n_x = ARCHS[rArch].n_outputs;
  const n_y = ARCHS[lArch].n_outputs;
  drawHMMDiagram(document.getElementById('left-hmm'),  lArch, lP, 'transducer', n_x);
  drawHMMDiagram(document.getElementById('right-hmm'), rArch, rP, 'transducer', n_y);
  // T: transducer with input alphabet n_x
  let Tperx;
  if (lArch === 'iid')           Tperx = transducer_iid(lP, n_x);
  else if (lArch === 'sns')      Tperx = transducer_sns(lP, n_x);
  else if (lArch === 'fractal2') Tperx = transducer_fractal2(lP, n_x);
  else                           Tperx = transducer_mess3(lP, n_x);
  // U: transducer with input alphabet n_y
  let Uupery;
  if (rArch === 'iid')           Uupery = transducer_iid(rP, n_y);
  else if (rArch === 'sns')      Uupery = transducer_sns(rP, n_y);
  else if (rArch === 'fractal2') Uupery = transducer_fractal2(rP, n_y);
  else                           Uupery = transducer_mess3(rP, n_y);

  const tDim = ARCHS[lArch].n_states;
  const uModDim = ARCHS[rArch].n_states * ARCHS[rArch].n_outputs;

  document.getElementById('left-dim').textContent  = `(T operator dim ${tDim})`;
  document.getElementById('right-dim').textContent = `(modified-op dim ${uModDim})`;
  document.getElementById('left-panel-title').textContent  = `Left  T (${ARCHS[lArch].name}) un-modified MSP`;
  document.getElementById('right-panel-title').textContent = `Right modified-op MSP — η on (S × X), Δ^${uModDim-1}`;

  const leftHost  = document.getElementById('left-msp');
  const rightHost = document.getElementById('right-msp');

  if (uModDim > 4) {
    rightHost.innerHTML = `<div style="text-align:center;color:#a30;font-size:13px;padding:30px">
      Modified-operator dim is ${uModDim} (= ${ARCHS[rArch].n_states} × ${ARCHS[rArch].n_outputs}).<br>
      Direct simplex visualisation supported only up to dim 4 (tetrahedron).<br>
      Choose IID or Fractal-2-state for U.</div>`;
    document.getElementById('product-wrap').style.display = 'none';
    document.getElementById('coarse-wrap').style.display = 'none';
    infoLine(`<span class="warn">Modified-operator dim ${uModDim} exceeds tetrahedron — limit U to IID or Fractal-2-state in feedback mode.</span>`);
    return;
  }

  const out = sampleFeedback(Tperx, Uupery, N, state.seed);

  // ----- Pre-compute four linear-algebraic dimensions for the feedback panels -----
  // LEFT — T-transducer as kernel list indexed by (x_obs, y_obs) on R.
  const Tlist_T = [];
  for (let x = 0; x < n_x; x++) for (let y = 0; y < n_y; y++) Tlist_T.push(Tperx[x][y]);
  const rho_T_init = stationary(matSum(Tlist_T));
  const dims_T = computeFourDims(Tlist_T, rho_T_init);
  // RIGHT — modified U op on (S, X) joint, kernels indexed by (x_obs, y_obs).
  //   M^{(x_obs, y_obs)}[(s, xs), (sp, xp)] = δ(xs, x_obs) · U^{(y_obs)}(xp | s, sp)
  const Tlist_U = [];
  for (let xObs = 0; xObs < n_x; xObs++) for (let yObs = 0; yObs < n_y; yObs++) {
    const M = Array.from({ length: out.n_joint }, () => new Array(out.n_joint).fill(0));
    for (let s = 0; s < out.n_S; s++) {
      const row = s * n_x + xObs;
      for (let sp = 0; sp < out.n_S; sp++) for (let xp = 0; xp < n_x; xp++) {
        M[row][sp * n_x + xp] = Uupery[yObs][xp][s][sp];
      }
    }
    Tlist_U.push(M);
  }
  const rho_U_init = stationary(matSum(Tlist_U));
  const dims_U = computeFourDims(Tlist_U, rho_U_init);
  // COARSE panels — cascade kernels in (R, S, X) joint, dim n_full.
  //   W^{(y)} = T^{(y|xs)}[r, rp] · U^{(y)}(xp | s, sp)             (coarse x → only y observed)
  //   W^{(x)} = δ(xs, x) · Σ_y T^{(y|x)}[r, rp] · U^{(y)}(xp | s, sp) (coarse y → only x observed)
  const n_full = out.n_full;
  const idx = (r, s, xs) => r * (out.n_S * n_x) + s * n_x + xs;
  const Tlist_casc_y = [];
  for (let y = 0; y < n_y; y++) {
    const M = Array.from({ length: n_full }, () => new Array(n_full).fill(0));
    for (let r = 0; r < out.n_R; r++) for (let s = 0; s < out.n_S; s++) for (let xs = 0; xs < n_x; xs++) {
      const rowIx = idx(r, s, xs);
      for (let rp = 0; rp < out.n_R; rp++) for (let sp = 0; sp < out.n_S; sp++) for (let xp = 0; xp < n_x; xp++) {
        M[rowIx][idx(rp, sp, xp)] = Tperx[xs][y][r][rp] * Uupery[y][xp][s][sp];
      }
    }
    Tlist_casc_y.push(M);
  }
  const Tlist_casc_x = [];
  for (let x = 0; x < n_x; x++) {
    const M = Array.from({ length: n_full }, () => new Array(n_full).fill(0));
    for (let r = 0; r < out.n_R; r++) for (let s = 0; s < out.n_S; s++) {
      const xs = x;
      const rowIx = idx(r, s, xs);
      for (let rp = 0; rp < out.n_R; rp++) for (let sp = 0; sp < out.n_S; sp++) for (let xp = 0; xp < n_x; xp++) {
        let sumY = 0;
        for (let y = 0; y < n_y; y++) sumY += Tperx[x][y][r][rp] * Uupery[y][xp][s][sp];
        M[rowIx][idx(rp, sp, xp)] = sumY;
      }
    }
    Tlist_casc_x.push(M);
  }
  const rho_full_init = stationary(matSum(Tlist_casc_y));
  const dims_casc_y = computeFourDims(Tlist_casc_y, rho_full_init);
  const dims_casc_x = computeFourDims(Tlist_casc_x, rho_full_init);

  // LEFT — render T's MSP, dim tDim
  if (tDim === 1) {
    const Pt0 = []; for (let k = 0; k < out.n_y; k++) Pt0.push(out.Pnext_y[(N - 1) * out.n_y + k]);
    renderPoint(leftHost, Pt0, out.n_y, '0-simplex (memoryless T)');
  } else if (tDim === 2) {
    renderLine(leftHost, out.Rbel, out.Pnext_y, out.n_R, out.n_y, 'η_A^R');
  } else {
    renderTriangle(leftHost, out.Rbel, out.Pnext_y, out.n_R, out.n_y);
  }
  svdPanel('left-svd', out.Rbel, out.n_R, N, 'σₖ — R (T)', dims_T);
  // RIGHT — render modified-op MSP on (S × X), dim uModDim
  if (uModDim === 2) {
    renderLine(rightHost, out.SXbel, out.Pnext_x, out.n_joint, out.n_x, 'η_0^{(S×X)}');
  } else if (uModDim === 4) {
    const labels = [
      `(s=A, x=0)`, `(s=A, x=1)`, `(s=B, x=0)`, `(s=B, x=1)`,
    ];
    renderTetrahedron(rightHost, out.SXbel, out.Pnext_x, out.n_joint, out.n_x, labels);
  }
  svdPanel('right-svd', out.SXbel, out.n_joint, N, 'σₖ — S×X', dims_U);

  // product simplex
  const productWrap = document.getElementById('product-wrap');
  const productTitle = document.getElementById('product-title');
  const productHost  = document.getElementById('product-msp');
  if (tDim === 2 && uModDim === 2) {
    productWrap.style.display = '';
    productTitle.textContent = `Joint marginals (η_A^R , η_0^{S×X}) — square product`;
    const lA = new Float32Array(N), rA = new Float32Array(N);
    for (let t = 0; t < N; t++) { lA[t] = out.Rbel[t * out.n_R]; rA[t] = out.SXbel[t * out.n_joint]; }
    renderSquare(productHost, lA, rA, out.Pnext_x, out.n_x, out.n_joint);
  } else if (tDim === 3 && uModDim === 2) {
    productWrap.style.display = '';
    productTitle.textContent = `Joint marginals — triangular cylinder (T 2-simplex × line)`;
    const lineSide = new Float32Array(N);
    for (let t = 0; t < N; t++) lineSide[t] = out.SXbel[t * out.n_joint];
    renderTriangularCylinder(productHost, lineSide, out.Rbel, out.n_R, out.Pnext_x, out.n_x);
  } else {
    productWrap.style.display = 'none';
  }
  // SVD of product belief = R ⊗ (S,X). Use the simple Kronecker of marginal beliefs;
  // a faithful joint sample would need the actual product trajectory which we don't store
  // in feedback mode — instead we stack Rbel and SXbel side-by-side as the empirical
  // characterisation of the two factored simplices. Report each separately would be cleaner;
  // for now use SXbel since R-side SVD already appears in left-svd.
  if (productWrap.style.display !== 'none') {
    svdPanel('product-svd', out.SXbel, out.n_joint, N, 'σₖ — S×X (factor)', dims_U);
  }

  // ----- Coarse-grained MSPs for feedback -----
  // Joint (R, S, X) lives in dim n_full = n_R · n_S · n_x.
  //  Left  panel (coarse-grain x = only y observed): cascBel_y, dim n_full.
  //  Right panel (coarse-grain y = only x observed): cascBel_x, dim n_full.
  // Label both panels with the (r, s, x_state) joint vertices.
  const fullLabs = [];
  const rNames = ['A', 'B', 'C']; const sNames = ['0', '1', '2'];
  for (let r = 0; r < out.n_R; r++) for (let s = 0; s < out.n_S; s++) for (let xs = 0; xs < out.n_x; xs++)
    fullLabs.push(`(r=${rNames[r] || r}, s=${sNames[s] || s}, x=${xs})`);
  renderCoarse(
    'feedback', tDim, out.n_full,
    out.cascBel_y, out.Pcasc_y_next, out.n_full, out.n_y,
    out.cascBel_x, out.Pcasc_x_next, out.n_full, out.n_x,
    `Joint (R,S,X) belief under only-y observer, η on Δ^${out.n_full - 1}`,
    `Joint (R,S,X) belief under only-x observer, η on Δ^${out.n_full - 1}`,
    fullLabs,
    fullLabs,
  );
  svdPanel('coarse-output-svd', out.cascBel_y, out.n_full, N, 'σₖ — only-y', dims_casc_y);
  svdPanel('coarse-input-svd',  out.cascBel_x, out.n_full, N, 'σₖ — only-x', dims_casc_x);

  infoLine(`<b>Mode:</b> feedback · T=${ARCHS[lArch].name} (dim ${tDim}) · U=${ARCHS[rArch].name} (modified-op dim ${uModDim}) · joint state ${tDim}×${uModDim} factored per Corollary 1. Coarse-grained joint (R,S,X) lives in Δ^${out.n_full - 1}.`);
}

// =====================================================
//  Wire up
// =====================================================
function rebuildSliders() {
  if (state.mode === 'feedforward') {
    // LEFT = HMM source (no input). RIGHT = transducer with input alphabet = LEFT n_outputs
    state.leftParams = {};
    buildSourceSliders(document.getElementById('left-params'), state.leftArch, state.leftParams);
    state.rightParams = {};
    const n_in = ARCHS[state.leftArch].n_outputs;
    buildTransducerSliders(document.getElementById('right-params'), state.rightArch, n_in, state.rightParams);
    document.getElementById('left-title').textContent  = 'Left — input HMM source';
    document.getElementById('right-title').textContent = 'Right — transducer';
  } else {
    // Both transducers
    state.leftParams = {};
    const n_x = ARCHS[state.rightArch].n_outputs;
    buildFeedbackTSliders(document.getElementById('left-params'), state.leftArch, n_x, state.leftParams);
    state.rightParams = {};
    const n_y = ARCHS[state.leftArch].n_outputs;
    buildTransducerSliders(document.getElementById('right-params'), state.rightArch, n_y, state.rightParams);
    document.getElementById('left-title').textContent  = 'Left — environment T (transducer, takes x from U)';
    document.getElementById('right-title').textContent = 'Right — agent U (transducer, takes y from T)';
  }
}

document.getElementById('mode').addEventListener('change', e => { state.mode = e.target.value; rebuildSliders(); rerun(); });
document.getElementById('left-arch').addEventListener('change', e => { state.leftArch = e.target.value; rebuildSliders(); rerun(); });
document.getElementById('right-arch').addEventListener('change', e => { state.rightArch = e.target.value; rebuildSliders(); rerun(); });
document.getElementById('nsteps').addEventListener('change', e => { state.nSteps = +e.target.value; rerun(); });

rebuildSliders();
rerun();
</script>
</body>
